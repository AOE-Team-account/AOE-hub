name: Backup Supabase database

on:
  schedule:
    # 09:00 UTC daily. GitHub Actions cron can be delayed by several
    # minutes during high load — that's fine for a nightly backup.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

# Read-only access to the repository; nothing else (AOE-SEC-09).
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      # Needed for scripts/prune-backups.py (the retention rule). Pinned to an exact version.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # AOE-SEC-23: backups stay OFF (on purpose) until the encryption key is set. Check
      # that first, before anything is dumped, and say so loudly: a red run, an error
      # note on the run page, and a box in the run summary.
      - name: Check the backup encryption key is set
        shell: bash
        run: |
          set -euo pipefail
          key="$(printf '%s' "${BACKUP_AGE_PUBLIC_KEY:-}" | tr -d '[:space:]')"
          if [[ ! "$key" =~ ^age1[02-9ac-hj-np-z]{58}$ ]]; then
            if [ -z "$key" ]; then why="is not set"; else why="does not look like an age public key (age1 + 58 letters/digits)"; fi
            msg="NO BACKUP WAS MADE. The repository variable BACKUP_AGE_PUBLIC_KEY $why. Backups are switched off until it is set, so nothing unencrypted ever leaves GitHub."
            echo "::error title=Database backup is OFF::$msg"
            {
              echo "## :x: Database backup is OFF"
              echo
              echo "$msg"
              echo
              echo "**To fix (Clara, on your own computer):**"
              echo "1. Install age, then run \`age-keygen -o aoehub-backup.key\`. Keep that file offline (it opens the backups)."
              echo "2. Copy the printed public key (\`age1...\`) into GitHub: Settings > Secrets and variables > Actions > **Variables** > \`BACKUP_AGE_PUBLIC_KEY\`."
              echo "3. Run this workflow again (Actions > Backup Supabase database > Run workflow) and test-restore the \`.age\` file (README, Backups)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Backup encryption key is set."
        env:
          BACKUP_AGE_PUBLIC_KEY: ${{ vars.BACKUP_AGE_PUBLIC_KEY }}

      - name: Dump database
        shell: bash
        run: |
          # The AI's search vectors (kb_chunks) are left out: they can be rebuilt
          # from the text and are more than half of the database's size. After a
          # restore, see RECOVERY.md to rebuild them.
          # postgres:17, pinned by digest so the image cannot change under us.
          docker run --rm postgres@sha256:cdbfb3de010ef603c29f10a5dfc79e023f66ad662ec6fddcda7130afe5d65e7b \
            pg_dump "$SUPABASE_DB_URL" --no-owner --format=plain \
              --exclude-table-data=public.kb_chunks \
            | gzip > backup.sql.gz

          size=$(stat -c%s backup.sql.gz)
          if [ "$size" -lt 1024 ]; then
            echo "Dump is suspiciously small ($size bytes) — refusing to upload a possibly-broken backup."
            exit 1
          fi
          echo "Dump size: $size bytes"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Encrypt before it leaves GitHub (AOE-SEC-09). The dump holds every member's
      # data and the sign-in table, so it is locked with an `age` PUBLIC key; only the
      # private key (kept offline by Clara, never in GitHub) can open it.
      # Set the repository variable BACKUP_AGE_PUBLIC_KEY (starts with "age1...").
      - name: Encrypt the dump
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_AGE_PUBLIC_KEY:-}" ]; then
            echo "::error title=Database backup is OFF::BACKUP_AGE_PUBLIC_KEY is not set. Refusing to upload an unencrypted backup."
            echo "Make a key pair with 'age-keygen -o aoehub-backup.key' on your own computer, keep that file offline,"
            echo "and put the printed public key (age1...) in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          sudo apt-get install -y -qq age >/dev/null
          age -r "$(printf '%s' "$BACKUP_AGE_PUBLIC_KEY" | tr -d '[:space:]')" -o backup.sql.gz.age backup.sql.gz
          shred -u backup.sql.gz 2>/dev/null || rm -f backup.sql.gz
        env:
          BACKUP_AGE_PUBLIC_KEY: ${{ vars.BACKUP_AGE_PUBLIC_KEY }}

      - name: Upload to Backblaze B2
        shell: bash
        run: |
          # Secrets pasted from a web page often carry stray whitespace/newlines.
          export AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')"
          export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')"
          B2_BUCKET_NAME="$(printf '%s' "$B2_BUCKET_NAME" | tr -d '[:space:]')"
          B2_ENDPOINT="$(printf '%s' "$B2_ENDPOINT" | tr -d '[:space:]')"
          # B2 signs requests with the region embedded in the endpoint (s3.<region>.backblazeb2.com).
          export AWS_DEFAULT_REGION="$(printf '%s' "$B2_ENDPOINT" | sed -E 's/^s3\.([^.]+)\.backblazeb2\.com$/\1/')"

          pip install --quiet "awscli==1.46.3"
          TODAY="$(date -u +%Y-%m-%d)"
          aws s3 cp backup.sql.gz.age "s3://$B2_BUCKET_NAME/backups/daily/aoehub-$TODAY.sql.gz.age" \
            --endpoint-url "https://$B2_ENDPOINT"

          # Retention: every daily copy for 30 days, then one a week (Sundays)
          # for a year. Only files named backups/daily/aoehub-YYYY-MM-DD.sql.gz
          # are ever considered for deletion.
          aws s3api list-objects-v2 --bucket "$B2_BUCKET_NAME" --prefix backups/daily/ \
            --endpoint-url "https://$B2_ENDPOINT" --query 'Contents[].Key' --output json \
            | python3 scripts/prune-backups.py > prune.txt
          while IFS= read -r key; do
            [ -n "$key" ] && aws s3 rm "s3://$B2_BUCKET_NAME/$key" --endpoint-url "https://$B2_ENDPOINT"
          done < prune.txt
          echo "Pruned $(wc -l < prune.txt | tr -d ' ') old backup(s)."

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
