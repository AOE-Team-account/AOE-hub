name: Backup Supabase database

on:
  schedule:
    # 09:00 UTC daily. GitHub Actions cron can be delayed by several
    # minutes during high load — that's fine for a nightly backup.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Needed for scripts/prune-backups.py (the retention rule).
      - uses: actions/checkout@v4

      - name: Dump database
        shell: bash
        run: |
          # The AI's search vectors (kb_chunks) are left out: they can be rebuilt
          # from the text and are more than half of the database's size. After a
          # restore, see RECOVERY.md to rebuild them.
          docker run --rm postgres:17 \
            pg_dump "$SUPABASE_DB_URL" --no-owner --format=plain \
              --exclude-table-data=public.kb_chunks \
            | gzip > backup.sql.gz

          size=$(stat -c%s backup.sql.gz)
          if [ "$size" -lt 1024 ]; then
            echo "Dump is suspiciously small ($size bytes) — refusing to upload a possibly-broken backup."
            exit 1
          fi
          echo "Dump size: $size bytes"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Upload to Backblaze B2
        shell: bash
        run: |
          # Secrets pasted from a web page often carry stray whitespace/newlines.
          export AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')"
          export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')"
          B2_BUCKET_NAME="$(printf '%s' "$B2_BUCKET_NAME" | tr -d '[:space:]')"
          B2_ENDPOINT="$(printf '%s' "$B2_ENDPOINT" | tr -d '[:space:]')"
          # B2 signs requests with the region embedded in the endpoint (s3.<region>.backblazeb2.com).
          export AWS_DEFAULT_REGION="$(printf '%s' "$B2_ENDPOINT" | sed -E 's/^s3\.([^.]+)\.backblazeb2\.com$/\1/')"

          pip install --quiet awscli
          TODAY="$(date -u +%Y-%m-%d)"
          aws s3 cp backup.sql.gz "s3://$B2_BUCKET_NAME/backups/daily/aoehub-$TODAY.sql.gz" \
            --endpoint-url "https://$B2_ENDPOINT"

          # Retention: every daily copy for 30 days, then one a week (Sundays)
          # for a year. Only files named backups/daily/aoehub-YYYY-MM-DD.sql.gz
          # are ever considered for deletion.
          aws s3api list-objects-v2 --bucket "$B2_BUCKET_NAME" --prefix backups/daily/ \
            --endpoint-url "https://$B2_ENDPOINT" --query 'Contents[].Key' --output json \
            | python3 scripts/prune-backups.py > prune.txt
          while IFS= read -r key; do
            [ -n "$key" ] && aws s3 rm "s3://$B2_BUCKET_NAME/$key" --endpoint-url "https://$B2_ENDPOINT"
          done < prune.txt
          echo "Pruned $(wc -l < prune.txt | tr -d ' ') old backup(s)."

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
