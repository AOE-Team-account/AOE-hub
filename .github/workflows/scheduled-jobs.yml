name: Scheduled hub jobs

# Runs the hub's housekeeping on a timer by calling its own protected job
# addresses. It does nothing until the repository has two secrets:
#   SITE_URL     the hub's address, e.g. https://aoe.ai (test) or https://aoe.name
#   CRON_SECRET  the same value as CRON_SECRET in the hub's settings
# Jobs: finish virus checks that were still waiting, erase what has been in the
# trash or in a deleted account for 30 days, keep the AI's search data up to date, and
# check how full the main storage is (a warning at 8, 9 and 10 GB).
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes: pending scans and AI search data
    - cron: "17 3 * * *"     # every day: the 30-day purge
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check the two secrets exist
        id: ready
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL or CRON_SECRET is not set yet; nothing to do."; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Finish waiting virus checks and index new content
        if: steps.ready.outputs.go == 'yes' && github.event.schedule != '17 3 * * *'
        run: |
          curl -fsS -m 120 -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/check-pending-scans"
          curl -fsS -m 120 -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/index-knowledge"
      - name: Erase what is 30 days past deletion
        if: steps.ready.outputs.go == 'yes' && (github.event.schedule == '17 3 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          curl -fsS -m 300 -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/purge-trash"
          curl -fsS -m 120 -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/storage-check"
